name: Catalog sync

on:
  schedule:
    # Daily at 03:47 UTC (06:47 in Türkiye), after FUT.GG's overnight updates.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  sync:
    name: Sync card catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fc27/data-sync build
      - name: Sync catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node packages/data-sync/dist/cli/sync-catalog.js
