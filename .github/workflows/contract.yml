name: Source contracts

on:
  schedule:
    # Daily at 06:17 UTC.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  contract:
    name: Live source contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fc27/data-sync test:contract
