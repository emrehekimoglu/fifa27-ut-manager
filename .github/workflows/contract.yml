name: Source contracts

on:
  schedule:
    # Daily at 06:17 UTC.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  contract:
    name: Live source contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fc27/data-sync test:contract
